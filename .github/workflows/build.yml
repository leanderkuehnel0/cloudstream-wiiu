name: Build WiiU Homebrew and Forwarder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Install WiiU development packages
        run: |
          dkp-pacman -Sy --noconfirm wut

      - name: Build homebrew
        run: |
          make -C .
        # The homebrew Makefile is in the repo root

      - name: Build forwarder
        run: |
          make -C forwarder

      - name: Upload homebrew artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello_world_wuhb
          path: hello_world.wuhb

      - name: Upload forwarder artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello_world_forwarder_rpx
          path: forwarder/forwarder.rpx