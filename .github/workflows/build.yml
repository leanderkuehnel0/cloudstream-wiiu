name: Build WiiU Homebrew

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
      options: --user root

    steps:
      - uses: actions/checkout@v3

      - name: Install WiiU development packages
        run: |
          pacman -Sy --noconfirm wut

      - name: Build
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: hello_world_wuhb
          path: hello_world.wuhb